appId: com.qgming.dreamagent
productName: 造梦师
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 内置技能：打包到 resources/skills，运行时由 SkillService 同步到 userData
extraResources:
  - from: resources/skills
    to: skills
  - from: resources/prompts
    to: prompts
  - from: build/icon.png
    to: icon.png
win:
  executableName: dreamagent
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  icon: build/icon.png
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb
  maintainer: qgming
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: qgming
  repo: dreamagent
